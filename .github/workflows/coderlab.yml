name: Enhanced benchmark and reward regressions
on:
  push:
  pull_request:
jobs:
  lightweight-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-lab.txt requests
      - run: python -m pytest -q enhancement_tests
      - run: python -m coderlab.cli export-verl --output /tmp/native
      - run: python -m coderlab.cli audit-native /tmp/native/*.jsonl
      - run: bash -n main_grpo.sh main_ppo.sh
      - run: GPUS_PER_NODE=8 CODER1_DRY_RUN=1 bash main_grpo.sh
      - run: GPUS_PER_NODE=8 CODER1_DRY_RUN=1 bash main_ppo.sh
